<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="container" style="max-width: 420px; padding-top: 48px;">
    <div class="card">
      <h2 style="margin-top:0;">تسجيل الدخول</h2>
      <form id="loginForm">
        <label>البريد</label>
        <input type="email" id="email" required placeholder="najjar@example.com" />
        <label style="margin-top:12px;">كلمة المرور</label>
        <input type="password" id="password" required placeholder="najjar" />
        <button class="btn btn-primary" style="width:100%; margin-top:16px;" type="submit">دخول</button>
      </form>
      <p id="msg" class="error hidden"></p>
      <p><a href="/">← الرئيسية</a></p>
    </div>
  </div>
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.classList.add("hidden");
      try {
        const data = await api("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        setToken(data.access_token);
        setUser(data.user);
        window.location.href = "/assets/panel.html";
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
