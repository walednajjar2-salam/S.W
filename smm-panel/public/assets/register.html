<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب — S.W</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-form-side">
      <div class="auth-card card card-glass">
        <div class="brand" style="margin-bottom: 24px;">
          <div class="brand-logo">SW</div>
          <div>S.<span>W</span></div>
        </div>
        <h2>إنشاء حساب</h2>
        <p class="subtitle">التسجيل متاح بكود الدعوة من المدير فقط</p>

        <form id="regForm">
          <div class="form-group">
            <label for="invite">كود الدعوة</label>
            <div class="input-wrap">
              <span class="input-icon">🎟️</span>
              <input type="text" id="invite" required placeholder="SW-XXXXXXXX" autocomplete="off" />
            </div>
          </div>
          <div class="form-group">
            <label for="name">الاسم</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input type="text" id="name" required minlength="2" placeholder="اسمك" />
            </div>
          </div>
          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
            </div>
          </div>
          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" required minlength="6" placeholder="••••••" autocomplete="new-password" />
            </div>
          </div>
          <button class="btn btn-primary btn-lg" style="width:100%; margin-top:8px;" type="submit">
            إنشاء الحساب
          </button>
        </form>

        <p id="msg" class="error hidden"></p>
        <div class="auth-footer">
          <a href="/login">لديك حساب؟ سجّل الدخول</a>
        </div>
      </div>
    </div>

    <div class="auth-brand">
      <div class="brand">
        <div class="brand-logo">SW</div>
        <div>S.<span>W</span></div>
      </div>
      <h1>انضم إلى<br />لوحة S.W</h1>
      <p>اطلب كود الدعوة من المدير ثم أنشئ حسابك وادخل إلى الطلبات والمحفظة.</p>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.classList.add("hidden");
      try {
        const data = await api("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            invite_code: document.getElementById("invite").value,
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        setToken(data.access_token);
        setUser(data.user);
        showToast("تم إنشاء الحساب");
        window.location.href = "/panel";
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove("hidden");
        showToast(err.message, "error");
      }
    });
  </script>
</body>
</html>
