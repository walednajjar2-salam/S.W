<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="container" style="max-width: 420px; padding-top: 48px;">
    <div class="card">
      <h2 style="margin-top:0;">إنشاء حساب</h2>
      <form id="regForm">
        <label>الاسم</label>
        <input type="text" id="name" required minlength="2" />
        <label style="margin-top:12px;">البريد</label>
        <input type="email" id="email" required />
        <label style="margin-top:12px;">كلمة المرور</label>
        <input type="password" id="password" required minlength="6" />
        <button class="btn btn-primary" style="width:100%; margin-top:16px;" type="submit">تسجيل</button>
      </form>
      <p id="msg" class="error hidden"></p>
      <p style="margin-top:16px;"><a href="/assets/login.html">لديك حساب؟ سجّل الدخول</a></p>
    </div>
  </div>
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.classList.add("hidden");
      try {
        const data = await api("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        setToken(data.access_token);
        setUser(data.user);
        window.location.href = "/assets/panel.html";
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
