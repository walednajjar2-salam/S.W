<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>معاينة جمال الشعار | جودة الانطلاقة</title>
  <link rel="stylesheet" href="lq-arabic-type.css?v=day6">
  <link rel="stylesheet" href="lq-official-atmosphere.css?v=day3">
  <link rel="stylesheet" href="lq-brand-mark.css?v=day2">
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
      color:var(--lq-atm-text);background:var(--lq-atm-sky);
    }
    .stage{position:relative;z-index:1;text-align:center;max-width:720px}
    h1{font-size:clamp(2rem,5vw,2.9rem);margin:18px 0 6px;font-weight:800;color:var(--lq-atm-ink)}
    .ar{color:var(--lq-atm-gold-deep);font-weight:800;margin:0 0 10px;font-size:1.25rem}
    p{color:var(--lq-atm-text);line-height:1.75;margin:0 auto;max-width:34rem;font-weight:600}
    .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    .card{
      background:rgba(255,255,255,.94);border:1px solid rgba(184,146,63,.32);
      border-radius:18px;padding:18px;min-width:220px;box-shadow:var(--lq-atm-shadow);
      text-align:center;
    }
    .card strong{display:block;margin-top:10px;font-size:.85rem;color:var(--lq-atm-ink)}
    .card span{display:block;margin-top:4px;font-size:.78rem;color:var(--lq-atm-muted)}
  </style>
</head>
<body class="lq-atm">
  <div class="lq-atm-bg" aria-hidden="true"></div>
  <main class="stage">
    <div class="lq-brand-mark lq-brand-mark--lg">
      <img src="/assets/brand-mark-gold.png?v=day1" alt="جودة الانطلاقة">
    </div>
    <h1>Launch Quality</h1>
    <p class="ar">جودة الانطلاقة</p>
    <p>خلفية نهارية ثلاثية الأبعاد + خط عربي واضح (IBM Plex Sans Arabic) + محاذاة موحّدة.</p>
    <div class="row">
      <div class="card">
        <div class="lq-brand-mark lq-brand-mark--md"><img src="/assets/brand-mark-gold.png?v=day1" alt=""></div>
        <strong>علامة الواجهة</strong>
        <span>لشاشة الدخول والبوابة</span>
      </div>
      <div class="card">
        <div class="lq-brand-mark lq-brand-mark--sm"><img src="/assets/brand-mark-gold.png?v=day1" alt=""></div>
        <strong>حجم صغير</strong>
        <span>للهيدر والتطبيقات</span>
      </div>
    </div>
  </main>
</body>
</html>
