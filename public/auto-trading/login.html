<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sign in | NAJJAR & AL SAMOOM TRADING</title>
  <link rel="icon" href="/assets/app-icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/auto-trading/auto-trading.css?v=at50">
  <link rel="stylesheet" href="/auto-trading/cinema-lux.css?v=cl2">
</head>
<body class="nt-login nt-cinema-lux">
  <canvas id="ntCinemaCanvas" class="nt-cinema-canvas" aria-hidden="true"></canvas>
  <div class="nt-cinema-vignette" aria-hidden="true"></div>
  <div class="nt-cinema-grid" aria-hidden="true"></div>
  <div class="nt-cinema-beams" aria-hidden="true"></div>
  <div class="nt-watermark" aria-hidden="true"></div>
  <div class="nt-lux-bg" aria-hidden="true"></div>
  <main class="nt-login-stage">
    <section class="nt-login-brand">
      <div id="loginBrandWrap"></div>
      <p class="nt-cinema-kicker">NAJJAR &amp; AL SAMOOM TRADING</p>
      <p class="nt-cinema-tag">USED &amp; IMPORTED CARS · GCC</p>
      <p class="nt-login-loc">محافظة الداخلية — ولاية نزوى</p>
    </section>
    <section class="nt-login-card">
      <h2>Sign in</h2>
      <p class="nt-login-hint">كلمات المرور أرقام 1–5 — اضغط على الحساب لملء الحقول تلقائياً</p>
      <label class="nt-field">
        <span>Username</span>
        <input id="loginUser" autocomplete="username" placeholder="waleed.najjar">
      </label>
      <label class="nt-field">
        <span>Password</span>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="1">
      </label>
      <div class="nt-login-creds" aria-label="حسابات الفريق">
        <button type="button" class="nt-login-creds-row" data-user="waleed.najjar" data-pass="1">
          <span class="nt-cred-name">وليد النجار</span>
          <span class="nt-cred-meta"><code>waleed.najjar</code> / <strong>1</strong> · مجلس إدارة</span>
        </button>
        <button type="button" class="nt-login-creds-row" data-user="hamad.sumoom" data-pass="2">
          <span class="nt-cred-name">حمد السموم</span>
          <span class="nt-cred-meta"><code>hamad.sumoom</code> / <strong>2</strong> · مجلس إدارة</span>
        </button>
        <button type="button" class="nt-login-creds-row" data-user="sara" data-pass="3">
          <span class="nt-cred-name">ساره</span>
          <span class="nt-cred-meta"><code>sara</code> / <strong>3</strong> · تشغيل</span>
        </button>
        <button type="button" class="nt-login-creds-row" data-user="sales" data-pass="4">
          <span class="nt-cred-name">مبيعات</span>
          <span class="nt-cred-meta"><code>sales</code> / <strong>4</strong> · مبيعات</span>
        </button>
        <button type="button" class="nt-login-creds-row" data-user="accounting" data-pass="5">
          <span class="nt-cred-name">محاسبة</span>
          <span class="nt-cred-meta"><code>accounting</code> / <strong>5</strong> · محاسبة</span>
        </button>
      </div>
      <button class="nt-btn primary" type="button" id="loginBtn">دخول → المنصات</button>
      <p id="loginErr" class="nt-err" hidden></p>
      <div class="nt-login-links">
        <a href="/najjar-al-samoom-used-imported-cars/customer.html">بوابة الزبائن</a>
        <a href="/najjar-al-samoom-used-imported-cars/platforms.html">المنصات</a>
      </div>
      <div class="nt-login-apps">
        <a href="/get-android">📱 أندرويد</a>
        <a href="/get-windows?desktop=1">🖥️ اختصار سطح المكتب (بدون EXE)</a>
      </div>
      <div class="nt-team-credits">
        <div class="nt-team-row">
          <span class="nt-team-label">Owners</span>
          <span class="nt-team-names">Walid Najjar &amp; Hamad Al Samoom</span>
        </div>
      </div>
    </section>
  </main>
  <script src="/auto-trading/najjar-path.js?v=at1"></script>
  <script src="/auto-trading/najjar-auth.js?v=na1"></script>
  <script src="/auto-trading/car-3d.js?v=at17"></script>
  <script src="/auto-trading/login-fx.js?v=cl2"></script>
  <script>
    const NB = window.NAJJAR_BASE || '/najjar-al-samoom-used-imported-cars';
    document.getElementById('loginBrandWrap').innerHTML = NajjarCar3D.renderGlassLogo({ size: 'login' });

    async function doLogin() {
      const err = document.getElementById('loginErr');
      err.hidden = true;
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) {
        err.textContent = 'أدخل اسم المستخدم وكلمة المرور';
        err.hidden = false;
        return;
      }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || 'فشل تسجيل الدخول');
        const token = data.token || data.access_token || '';
        if (!token) throw new Error('لم يُرجع الخادم رمز الدخول');
        NajjarAuth.setToken(token);
        NajjarAuth.setPortal('autotrading');
        location.replace(NB + '/platforms.html?from=login&token=' + encodeURIComponent(token));
      } catch (e) {
        err.textContent = e.message || 'تعذر الدخول';
        err.hidden = false;
      } finally {
        btn.disabled = false;
      }
    }

    function selectCredRow(row) {
      document.querySelectorAll('.nt-login-creds-row').forEach((el) => {
        el.classList.toggle('is-selected', el === row);
      });
      document.getElementById('loginUser').value = row.dataset.user || '';
      document.getElementById('loginPass').value = row.dataset.pass || '';
      document.getElementById('loginPass').focus();
    }

    document.querySelectorAll('.nt-login-creds-row').forEach((row) => {
      row.addEventListener('click', () => selectCredRow(row));
    });
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('loginPass').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') doLogin();
    });
    document.getElementById('loginUser').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') document.getElementById('loginPass').focus();
    });
    (async () => {
      NajjarAuth.purgeLegacyBrandStorage();
      let saved = NajjarAuth.getToken();
      if (!saved) return;
      try {
        const res = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + saved } });
        if (res.ok) {
          location.replace(NB + '/platforms.html');
          return;
        }
      } catch (_) {
        return;
      }
      NajjarAuth.clearToken();
    })();
  </script>
</body>
</html>
