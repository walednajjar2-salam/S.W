<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>معاينة تصميم الدخول | جودة الانطلاقة</title>
  <link rel="stylesheet" href="lq-official-atmosphere.css?v=day3">
  <link rel="stylesheet" href="lq-brand-mark.css?v=day6">
  <link rel="stylesheet" href="lq-login-locked.css?v=day5">
  <link rel="stylesheet" href="lq-arabic-type.css?v=day6">
  <style>
    body{margin:0}
    .preview-note{
      position:fixed;top:10px;inset-inline-start:10px;z-index:30;
      background:rgba(15,39,64,.78);color:#fff;border:1px solid rgba(184,146,63,.45);
      border-radius:10px;padding:8px 12px;font:700 12px var(--lq-font);
    }
  </style>
</head>
<body class="login-ultra saas-login lq-exec">
  <div class="preview-note">معاينة تصميم الدخول · لا تحتاج بيانات</div>
  <main id="loginScreen" class="login">
    <div class="login-cinema-photo-layer lq-atm-bg" aria-hidden="true"></div>
    <div class="login-shell">
      <div class="login-top-logo">
        <div class="lq-brand-mark lq-brand-mark--hero login-logo-wrap login-logo-wrap--float">
          <img src="assets/brand-mark-gold.png?v=day3" alt="مشاريع جودة الانطلاقة" class="login-logo-img login-logo-img--float" width="655" height="411" fetchpriority="high">
        </div>
        <div class="login-brand-copy">
          <h1 class="login-brand-name">Launch Quality</h1>
          <p class="login-brand-ar">جودة الانطلاقة</p>
          <p class="login-brand-support">لإدارة الجودة في المشاريع العقارية والضيافة</p>
          <hr class="login-brand-rule">
        </div>
      </div>
      <div class="login-stage login-stage--center">
        <div class="login-glass-stage">
          <div class="login-auth login-auth--float">
            <section class="login-glass-card ev-auth-card login-card--floating" aria-label="تسجيل الدخول">
              <div id="loginLangMount" class="login-topbar-lang"></div>
              <div class="login-card-head">
                <div>
                  <h2 class="login-card-title" data-i18n="welcomeBack">مرحباً بك</h2>
                  <p class="login-card-sub" data-i18n="signInContinue">سجّل الدخول للوصول إلى حسابك</p>
                </div>
              </div>
              <div class="ev-auth-pane login-form">
                <label class="login-field">
                  <span class="login-field-label" data-i18n="username">اسم المستخدم</span>
                  <input placeholder="اسم المستخدم" autocomplete="username" data-i18n-placeholder="username">
                </label>
                <label class="login-field">
                  <span class="login-field-label" data-i18n="password">كلمة المرور</span>
                  <input placeholder="كلمة المرور" type="password" autocomplete="current-password" data-i18n-placeholder="password">
                  <button type="button" class="login-pass-toggle">إظهار</button>
                </label>
                <div class="login-inline-tools">
                  <label class="login-remember-check"><input type="checkbox"> <span data-i18n="rememberMe">تذكرني على هذا الجهاز</span></label>
                  <button type="button" class="ghost login-help-btn" data-i18n="support">الدعم الفني</button>
                </div>
                <button class="gold-btn login-submit" type="button" data-i18n="signIn">دخول</button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="lq-i18n.js?v=day9"></script>
  <script>
    (function () {
      var mount = document.getElementById("loginLangMount");
      if (mount && window.LQ_I18N) {
        mount.innerHTML = window.LQ_I18N.langSwitcherHtml("loginLang");
        window.LQ_I18N.bindSwitcher("loginLang");
        window.LQ_I18N.applyDocument();
      }
    })();
  </script>
</body>
</html>
