services:
  - type: web
    name: sw-panel
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: sw-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SMM_SECRET_KEY
        generateValue: true
      - key: SMM_ADMIN_EMAIL
        value: walednajjar2@gmail.com
      - key: SMM_DATABASE_PATH
        value: /app/data/panel.db
